<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>聚餐命運抽卡 · 爆炸特效版</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #fff;
      background: radial-gradient(circle at 10% 0%, #050816 0%, #020010 45%, #000 100%);
    }
    canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      background: radial-gradient(circle at 50% 0%, #05091b 0%, #020010 50%, #000 100%);
      z-index: 1;
    }
    h1 {
      position: fixed;
      z-index: 10;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      margin: 0;
      padding: 4px 16px;
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      color: #d3e4ff;
      text-shadow: 0 0 18px rgba(120, 190, 255, 0.9), 0 0 42px rgba(150, 120, 255, 0.9);
      background: radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 0.7), transparent 70%);
      border-radius: 999px;
    }
    .hint {
      position: fixed;
      z-index: 10;
      top: 56px;
      left: 50%;
      transform: translateX(-50%);
      margin: 0;
      font-size: 0.8rem;
      opacity: 0.85;
      text-shadow: 0 0 8px rgba(0, 0, 0, 0.85);
    }
    .controls {
      position: fixed;
      z-index: 10;
      left: 50%;
      bottom: 32px;
      transform: translateX(-50%);
      width: 100%;
      max-width: 420px;
      padding: 0 16px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }
    .controls input {
      width: 100%;
      padding: 10px 16px;
      border-radius: 999px;
      border: none;
      outline: none;
      font-size: 0.95rem;
      background: rgba(3, 6, 26, 0.9);
      color: #fff;
      box-shadow: 0 0 18px rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(16px);
    }
    .controls input::placeholder {
      color: rgba(200, 210, 255, 0.55);
    }
    .controls button {
      width: 100%;
      padding: 12px 16px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 700;
      color: #050816;
      background: linear-gradient(135deg, #ffe45e, #ff9ff3, #6bc4ff, #a78bfa);
      background-size: 260% 260%;
      box-shadow: 0 0 22px rgba(255, 240, 180, 0.95), 0 0 52px rgba(120, 200, 255, 0.9);
      animation: buttonGlow 4s ease-in-out infinite;
    }
    .controls button:active {
      transform: translateY(1px) scale(0.99);
      box-shadow: 0 0 12px rgba(255, 240, 180, 0.9);
    }
    .message {
      min-height: 1.4em;
      font-size: 0.9rem;
      text-shadow: 0 0 8px rgba(0, 0, 0, 0.9);
    }
    @keyframes buttonGlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
  </style>
</head>
<body>
  <h1>✨ 聚餐命運抽卡 ✨</h1>
  <p class="hint">輸入「馬辣, 鼎旺, 撈王...」按下抽卡，就會用爆炸特效抽出今晚命運之選</p>
  <canvas id="fxCanvas"></canvas>
  <div class="controls">
    <input id="optionsInput" type="text" value="鼎旺, 金蓬萊, 驥園, URBAN, 享鴨, NAGOMI" placeholder="輸入選項，用逗號分隔" />
    <button id="startButton">🃏 抽出今晚命運之卡！</button>
    <div id="message" class="message"></div>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById('fxCanvas');
      const ctx = canvas.getContext('2d');
      const input = document.getElementById('optionsInput');
      const btn = document.getElementById('startButton');
      const msg = document.getElementById('message');

      let width = window.innerWidth;
      let height = window.innerHeight;

      function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        const dpr = window.devicePixelRatio || 1;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      window.addEventListener('resize', resize);
      resize();

      // 狀態相關
      let options = [];
      let state = 'idle'; // idle | rolling | celebrate
      let finalLabel = '';
      let rollStart = 0;
      const SCATTER_DURATION = 2000;
      const REVEAL_DURATION = 1000;
      const ROLL_DURATION = SCATTER_DURATION + REVEAL_DURATION;

      // 物件陣列
      const floatingCards = [];
      const confetti = [];
      const sparks = [];
      const stars = [];
      const orbs = [];

      let winnerCard = null;
      let celebrateStart = 0;
      let winnerOrigin = null;

      // 解析輸入選項
      function parseOptions() {
        options = input.value
          .split(',')
          .map(x => x.trim())
          .filter(Boolean);
      }

      // 背景星點與光球
      function seedBackground() {
        stars.length = 0;
        orbs.length = 0;

        const starCount = 160;
        for (let i = 0; i < starCount; i++) {
          stars.push({
            x: Math.random() * width,
            y: Math.random() * height,
            z: 0.3 + Math.random() * 1.2,
            radius: 0.6 + Math.random() * 1.4,
            twinkle: Math.random() * Math.PI * 2
          });
        }

        const orbCount = 28;
        for (let i = 0; i < orbCount; i++) {
          orbs.push({
            x: Math.random() * width,
            y: Math.random() * height,
            baseR: 18 + Math.random() * 40,
            phase: Math.random() * Math.PI * 2,
            speed: 0.2 + Math.random() * 0.4,
            depth: 0.5 + Math.random() * 1.4
          });
        }
      }

      // 初始化卡片
      function seedFloatingCards() {
        floatingCards.length = 0;
        winnerCard = null;
        if (!options.length) return;

        const baseCount = Math.min(120, Math.max(32, options.length * 10));
        const maxRadius = Math.min(width, height) * 0.95;

        for (let i = 0; i < baseCount; i++) {
          const optionIndex = i % options.length;
          const radius = 120 + Math.random() * maxRadius;
          const angle = Math.random() * Math.PI * 2;
          const depth = 0.45 + Math.random() * 1.1;

          floatingCards.push({
            optionIndex,
            label: options[optionIndex],
            radius,
            angle,
            depth,
            speed: (Math.random() * 0.5 + 0.15) * (Math.random() < 0.5 ? 1 : -1),
            wobbleAmp: 10 + Math.random() * 24,
            wobblePhase: Math.random() * Math.PI * 2,
            size: 18 + Math.random() * 16,
            hue: 180 + Math.random() * 120,
            seed: Math.random() * 1000,
            flipPhase: Math.random() * Math.PI * 2,
            flipSpeed: 0.6 + Math.random() * 0.9,
            appearing: true,
            birthTime: performance.now(),
            lastX: null,
            lastY: null
          });
        }
      }

      // 輸入時只更新文字與 mapping，不重建架構
      input.addEventListener('input', () => {
        if (state !== 'idle' && state !== 'celebrate') return;
        parseOptions();
        msg.textContent = '';

        if (!options.length) return;

        for (const card of floatingCards) {
          if (options.length === 0) continue;
          card.optionIndex = card.optionIndex % options.length;
          card.label = options[card.optionIndex];
        }

        if (state === 'celebrate') {
          state = 'idle';
          winnerCard = null;
          winnerOrigin = null;
        }
      });

      function createConfettiBurst() {
        confetti.length = 0;
        const count = 320;
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 5 + Math.random() * 7;
          confetti.push({
            x: width / 2,
            y: height / 2,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            size: 4 + Math.random() * 6,
            color: `hsl(${Math.random() * 360}, 95%, 60%)`,
            rotation: Math.random() * Math.PI * 2,
            vr: (Math.random() - 0.5) * 0.6,
            life: 1.2 + Math.random() * 0.8
          });
        }
      }

      function createSparksBurst() {
        sparks.length = 0;
        const count = 260;
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 9 + Math.random() * 12;
          sparks.push({
            x: width / 2,
            y: height / 2,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 0.4 + Math.random() * 0.5,
            age: 0,
            width: 1 + Math.random() * 1.8,
            hue: 40 + Math.random() * 60
          });
        }
      }

      function startDraw() {
        if (state === 'rolling') return;
        parseOptions();
        if (!options.length) {
          msg.textContent = '請先輸入至少一個選項喔！';
          return;
        }
        state = 'rolling';
        msg.textContent = '';
        rollStart = performance.now();
        finalLabel = '';
        winnerCard = null;
        celebrateStart = 0;
        winnerOrigin = null;
        confetti.length = 0;
        sparks.length = 0;
      }

      btn.addEventListener('click', startDraw);

      parseOptions();
      seedBackground();
      seedFloatingCards();

      let lastTime = performance.now();

      function drawBackground(time) {
        const centerX = width / 2;
        const centerY = height / 2;

        const t = time * 0.00015;
        const h1 = 225 + 10 * Math.sin(t * 1.3);
        const h2 = 260 + 18 * Math.cos(t * 0.9);
        const h3 = 285 + 14 * Math.sin(t * 1.7);
        const grd = ctx.createRadialGradient(
          centerX,
          centerY * 0.35,
          0,
          centerX,
          centerY * 1.25,
          Math.max(width, height)
        );
        grd.addColorStop(0, `hsl(${h1}, 68%, 26%)`);
        grd.addColorStop(0.35, `hsl(${h2}, 74%, 14%)`);
        grd.addColorStop(0.75, `hsl(${h3}, 86%, 10%)`);
        grd.addColorStop(1, '#000');
        ctx.fillStyle = grd;
        ctx.fillRect(0, 0, width, height);

        // 星點
        ctx.save();
        ctx.globalAlpha = 0.7;
        for (const s of stars) {
          const tw = 0.5 + 0.5 * Math.sin(time * 0.0025 + s.twinkle);
          const driftX = Math.cos(time * 0.00018 + s.twinkle) * s.z * 18;
          const driftY = Math.sin(time * 0.00016 + s.twinkle * 1.3) * s.z * 12;
          const sx = s.x + driftX;
          const sy = s.y + driftY;
          const depthBoost = Math.pow(s.z, 1.3);
          const alpha = (0.12 + 0.5 * tw) * depthBoost;
          const r = s.radius * depthBoost * (0.8 + tw * 0.8);
          ctx.fillStyle = `rgba(${130 + tw * 90}, ${160 + tw * 70}, 255, ${alpha})`;
          ctx.beginPath();
          ctx.arc(sx, sy, r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

        // 光球 / 泡泡
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        for (const o of orbs) {
          const tOrb = time * 0.0008 * o.speed + o.phase;
          const y = o.y + Math.sin(tOrb) * 52 * o.depth;
          const x = o.x + Math.cos(tOrb * 0.85) * 78 * (o.depth - 0.4);
          const r = o.baseR * (1.2 + 0.8 * o.depth); // 半徑更大一點，邊界更柔
          const alphaBase = 0.18 + 0.22 * o.depth;   // 整體透明度偏柔和

          const orbGrad = ctx.createRadialGradient(x, y, 0, x, y, r);
          orbGrad.addColorStop(0, `rgba(180, 220, 255, ${alphaBase * 0.7})`);
          orbGrad.addColorStop(0.3, `rgba(120, 190, 255, ${alphaBase * 0.5})`);
          orbGrad.addColorStop(0.65, `rgba(70, 130, 220, ${alphaBase * 0.25})`);
          orbGrad.addColorStop(0.9, `rgba(20, 40, 120, ${alphaBase * 0.1})`);
          orbGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');

          ctx.fillStyle = orbGrad;
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalCompositeOperation = 'source-over';
        ctx.restore();

        // 中央水波 / 旋渦圈圈
        const isRollingBg = state === 'rolling';
        const elapsedRollingBg = isRollingBg ? (time - rollStart) : 0;
        const scatterPhaseBg = isRollingBg ? Math.min(elapsedRollingBg / SCATTER_DURATION, 1) : 0;
        const pull = 1 - 0.4 * scatterPhaseBg;
        const baseR = Math.min(width, height) * 0.22 * pull;
        for (let i = 0; i < 4; i++) {
          const ringT = i / 3;
          const r = baseR * (1 + ringT * 0.9 + Math.sin(time * 0.0015 + i) * 0.12 * (1 + scatterPhaseBg));
          const alphaBase = 0.26 - ringT * 0.05 + 0.25 * scatterPhaseBg;
          const alpha = Math.max(alphaBase, 0);
          ctx.beginPath();
          ctx.arc(centerX, centerY, r, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(120, 180, 255, ${alpha})`;
          ctx.lineWidth = 2 + i * 2 + scatterPhaseBg * 3;
          ctx.stroke();
        }
      }

      function drawTarotFrame(w, h, hue) {
        const grd = ctx.createLinearGradient(-w / 2, -h / 2, w / 2, h / 2);
        grd.addColorStop(0, `hsl(${hue}, 80%, 72%)`);
        grd.addColorStop(0.4, `hsl(${(hue + 40) % 360}, 80%, 60%)`);
        grd.addColorStop(1, `hsl(${(hue + 80) % 360}, 78%, 52%)`);
        ctx.fillStyle = grd;
        ctx.strokeStyle = 'rgba(220,230,255,0.98)';
        ctx.lineWidth = 2;

        const r = Math.min(w, h) * 0.16;
        ctx.beginPath();
        ctx.moveTo(-w / 2 + r, -h / 2);
        ctx.lineTo(w / 2 - r, -h / 2);
        ctx.quadraticCurveTo(w / 2, -h / 2, w / 2, -h / 2 + r);
        ctx.lineTo(w / 2, h / 2 - r);
        ctx.quadraticCurveTo(w / 2, h / 2, w / 2 - r, h / 2);
        ctx.lineTo(-w / 2 + r, h / 2);
        ctx.quadraticCurveTo(-w / 2, h / 2, -w / 2, h / 2 - r);
        ctx.lineTo(-w / 2, -h / 2 + r);
        ctx.quadraticCurveTo(-w / 2, -h / 2, -w / 2 + r, -h / 2);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        const inset = 8;
        const rInner = Math.min(w, h) * 0.14;
        const ix1 = -w / 2 + inset;
        const iy1 = -h / 2 + inset;
        const ix2 = w / 2 - inset;
        const iy2 = h / 2 - inset;
        ctx.beginPath();
        ctx.moveTo(ix1 + rInner, iy1);
        ctx.lineTo(ix2 - rInner, iy1);
        ctx.quadraticCurveTo(ix2, iy1, ix2, iy1 + rInner);
        ctx.lineTo(ix2, iy2 - rInner);
        ctx.quadraticCurveTo(ix2, iy2, ix2 - rInner, iy2);
        ctx.lineTo(ix1 + rInner, iy2);
        ctx.quadraticCurveTo(ix1, iy2, ix1, iy2 - rInner);
        ctx.lineTo(ix1, iy1 + rInner);
        ctx.quadraticCurveTo(ix1, iy1, ix1 + rInner, iy1);
        ctx.closePath();
        const inner = ctx.createLinearGradient(-w / 2, -h / 2, w / 2, h / 2);
        inner.addColorStop(0, 'rgba(245,250,255,0.96)');
        inner.addColorStop(0.5, 'rgba(232,238,255,0.98)');
        inner.addColorStop(1, 'rgba(225,236,255,0.96)');
        ctx.fillStyle = inner;
        ctx.fill();
      }

      function drawFloatingCards(time) {
        if (!floatingCards.length) return;
        const centerX = width / 2;
        const centerY = height / 2;

        const isRolling = state === 'rolling';
        const elapsedRolling = isRolling ? (time - rollStart) : 0;
        const scatterPhase = isRolling ? Math.min(elapsedRolling / SCATTER_DURATION, 1) : 0;

        floatingCards.sort((a, b) => a.depth - b.depth);

        for (const card of floatingCards) {
          if (card === winnerCard && state === 'celebrate') continue;

          const baseWobble = 1.15 + card.depth * 0.25;
          let speedFactor = 1;
          let wobbleFactor = baseWobble;
          let radiusJitter = 12;
          let vortexInward = 1;
          let swirlExtra = 0;

          if (isRolling) {
            const fall = Math.min(scatterPhase, 1);
            // 進入黑洞：速度更快、抖動更大、半徑不斷收縮，甚至略微穿越中心
            speedFactor = 1 + 6.2 * (0.5 - Math.cos(fall * Math.PI) / 2);
            wobbleFactor = baseWobble + 3.2 * fall;
            radiusJitter = 260 * fall * fall;
            vortexInward = Math.max(-0.25, 1 - 2.0 * Math.pow(fall, 1.15));
            swirlExtra = 0.09 * fall * (card.radius / (Math.min(width, height) * 0.95));
          } else {
            speedFactor = 1;
            wobbleFactor = baseWobble;
            radiusJitter = 12;
            vortexInward = 1;
            swirlExtra = 0.01 * (card.radius / (Math.min(width, height) * 0.95));
          }

          card.angle += card.speed * 0.002 * speedFactor + swirlExtra;
          const wobble = Math.sin(time * 0.0025 + card.wobblePhase) * card.wobbleAmp * wobbleFactor;
          const breathe = 1 + 0.06 * Math.sin(time * 0.0012 + card.seed);
          const baseRadius = card.radius * vortexInward * card.depth * breathe;
          const dynBase = baseRadius + Math.sin(time * 0.0045 + card.wobblePhase) * radiusJitter * card.depth;

          let x = centerX + Math.cos(card.angle) * dynBase;(card.angle) * dynBase;
          let y = centerY + Math.sin(card.angle) * dynBase * 0.5 + wobble;

          if (isRolling) {
            const pullT = scatterPhase;
            const pullStrength = 0.3 * pullT;
            x = centerX + (x - centerX) * (1 - pullStrength);
            y = centerY + (y - centerY) * (1 - pullStrength);
          }

          card.lastX = x;
          card.lastY = y;

          const depthScale = 0.6 + card.depth * 0.7;
          const w = card.size * 2.4 * depthScale;
          const h = card.size * 1.5 * depthScale;

          ctx.save();
          ctx.translate(x, y);
          const flipT = Math.sin(time * 0.0018 * card.flipSpeed + card.flipPhase);
          const flipScaleY = 0.9 + 0.18 * flipT;
          ctx.scale(1, flipScaleY);
          ctx.rotate(Math.sin(time * 0.0012 + card.angle + card.seed) * (isRolling ? 1.0 : 0.55));

          const shadowOffset = 10 * card.depth;
          const shadowR = Math.max(w, h) * 0.55;
          const shadowGrad = ctx.createRadialGradient(0, shadowOffset, 0, 0, shadowOffset, shadowR);
          shadowGrad.addColorStop(0, 'rgba(0, 0, 0, 0.4)');
          shadowGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
          ctx.save();
          ctx.translate(0, 6 * card.depth);
          ctx.fillStyle = shadowGrad;
          ctx.beginPath();
          ctx.arc(0, 0, shadowR, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          let alpha = 0.75 + card.depth * 0.25;
          if (card.appearing) {
            const tIn = Math.min((time - (card.birthTime || 0)) / 600, 1);
            if (tIn >= 1) {
              card.appearing = false;
            }
            alpha *= Math.max(tIn, 0);
          }
          ctx.globalAlpha = alpha;
          drawTarotFrame(w, h, card.hue);

          const label = card.label || '';
          ctx.fillStyle = '#161524';
          ctx.strokeStyle = 'rgba(0,0,0,0.18)';
          ctx.lineWidth = 1.4;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          const maxWidth = w - 30;
          let fontSize = 14 * depthScale;
          ctx.font = `600 ${fontSize}px system-ui`;
          while (ctx.measureText(label).width > maxWidth && fontSize > 8) {
            fontSize -= 1;
            ctx.font = `600 ${fontSize}px system-ui`;
          }
          ctx.strokeText(label, 0, 0);
          ctx.fillText(label, 0, 0);

          ctx.restore();
        }

        if (winnerCard && state === 'celebrate') {
          const card = winnerCard;
          const centerX2 = width / 2;
          const centerY2 = height / 2;

          ctx.save();
          const startX = winnerOrigin && typeof winnerOrigin.x === 'number' ? winnerOrigin.x : centerX2;
          const startY = winnerOrigin && typeof winnerOrigin.y === 'number' ? winnerOrigin.y : centerY2;
          const elapsedCelebrate = time - celebrateStart;
          const travelT = Math.min(elapsedCelebrate / 450, 1);
          const px = startX + (centerX2 - startX) * travelT;
          const py = startY + (centerY2 - startY) * travelT;

          ctx.translate(px, py);

          const appearT = Math.min(elapsedCelebrate / 650, 1);
          const easeAppear = 1 - Math.pow(1 - appearT, 3);
          const explodeT = Math.min(elapsedCelebrate / 900, 1);
          const baseScale = 0.35 + 2.3 * easeAppear;
          const explodeBoost = 1 + 0.35 * Math.sin(explodeT * Math.PI);
          const pulse = 1 + Math.sin(time * 0.003) * 0.22;
          const scale = baseScale * explodeBoost * pulse;
          ctx.scale(scale, scale);
          ctx.rotate(Math.sin(time * 0.0018 + card.angle) * 0.65);

          const haloR = Math.min(width, height) * 0.5;
          const glowFade = 1 - Math.min(elapsedCelebrate / 3200, 1);

          const fireR = haloR * 0.65;
          const fire = ctx.createRadialGradient(0, 0, 0, 0, 0, fireR);
          fire.addColorStop(0, `rgba(255,255,230,${0.95 * glowFade})`);
          fire.addColorStop(0.25, `rgba(255,220,140,${0.9 * glowFade})`);
          fire.addColorStop(0.55, `rgba(255,150,80,${0.78 * glowFade})`);
          fire.addColorStop(0.9, `rgba(160,40,40,${0.35 * glowFade})`);
          fire.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = fire;
          ctx.beginPath();
          ctx.arc(0, 0, fireR, 0, Math.PI * 2);
          ctx.fill();

          const halo = ctx.createRadialGradient(0, 0, 0, 0, 0, haloR);
          halo.addColorStop(0, `rgba(255,255,255,${0.99 * glowFade})`);
          halo.addColorStop(0.3, `rgba(190,220,255,${0.96 * glowFade})`);
          halo.addColorStop(0.7, `rgba(80,140,255,${0.7 * glowFade})`);
          halo.addColorStop(1, 'rgba(5,0,20,0)');
          ctx.fillStyle = halo;
          ctx.beginPath();
          ctx.arc(0, 0, haloR, 0, Math.PI * 2);
          ctx.fill();

          const shockT = Math.min(elapsedCelebrate / 900, 1);
          const shockAlpha = 0.5 * (1 - shockT) * glowFade;
          if (shockAlpha > 0.01) {
            ctx.save();
            ctx.globalAlpha = shockAlpha;
            ctx.beginPath();
            ctx.arc(0, 0, haloR * (0.35 + 0.55 * shockT), 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255,250,230,0.95)';
            ctx.lineWidth = 3 + 6 * (1 - shockT);
            ctx.stroke();
            ctx.restore();
          }

          const baseSize = card.size * 2.9;
          const w = baseSize * 2.3;
          const h = baseSize * 1.7;
          drawTarotFrame(w, h, card.hue);

          const label = card.label || '';
          ctx.fillStyle = '#131221';
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 4;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          const maxWidth = w - 70;
          let fontSize = 28;
          ctx.font = `700 ${fontSize}px system-ui`;
          while (ctx.measureText(label).width > maxWidth && fontSize > 14) {
            fontSize -= 2;
            ctx.font = `700 ${fontSize}px system-ui`;
          }
          ctx.strokeText(label, 0, 0);
          ctx.fillText(label, 0, 0);

          ctx.restore();
        }
      }

      function updateConfetti(delta) {
        for (const c of confetti) {
          c.x += c.vx;
          c.y += c.vy;
          c.vy += 0.16;
          c.vx *= 0.995;
          c.rotation += c.vr;
          c.life -= delta * 0.6;
        }
      }

      function drawConfetti() {
        ctx.save();
        for (const c of confetti) {
          if (c.life <= 0) continue;
          ctx.save();
          ctx.translate(c.x, c.y);
          ctx.rotate(c.rotation);
          ctx.globalAlpha = Math.max(0, c.life);
          ctx.fillStyle = c.color;
          ctx.fillRect(-c.size / 2, -c.size / 2, c.size, c.size * 0.6);
          ctx.restore();
        }
        ctx.restore();
      }

      function updateSparks(delta) {
        for (const s of sparks) {
          s.x += s.vx;
          s.y += s.vy;
          s.vy += 20 * delta;
          s.age += delta;
        }
      }

      function drawSparks() {
        ctx.save();
        for (const s of sparks) {
          if (s.age >= s.life) continue;
          const t = s.age / s.life;
          const alpha = 1 - t;
          ctx.globalAlpha = alpha;
          ctx.strokeStyle = `hsl(${s.hue}, 100%, ${60 + 20 * (1 - t)}%)`;
          ctx.lineWidth = s.width;
          ctx.beginPath();
          ctx.moveTo(s.x, s.y);
          ctx.lineTo(s.x - s.vx * 0.2, s.y - s.vy * 0.2);
          ctx.stroke();
        }
        ctx.restore();
      }

      function animate(time) {
        requestAnimationFrame(animate);
        const delta = (time - lastTime) / 1000;
        lastTime = time;

        drawBackground(time);
        drawFloatingCards(time);

        if (state === 'rolling') {
          const elapsed = time - rollStart;
          if (elapsed >= ROLL_DURATION) {
            if (!winnerCard) {
              if (floatingCards.length) {
                const idx = Math.floor(Math.random() * floatingCards.length);
                winnerCard = floatingCards[idx];
                finalLabel = winnerCard.label;
                winnerOrigin = {
                  x: typeof winnerCard.lastX === 'number' ? winnerCard.lastX : width / 2,
                  y: typeof winnerCard.lastY === 'number' ? winnerCard.lastY : height / 2
                };
              } else if (options.length) {
                finalLabel = options[Math.floor(Math.random() * options.length)];
                winnerOrigin = { x: width / 2, y: height / 2 };
              }
            }
            state = 'celebrate';
            celebrateStart = time;
            createConfettiBurst();
            createSparksBurst();
            if (finalLabel) {
              msg.textContent = `今晚吃：${finalLabel}`;
            }
          }
        }

        if (confetti.length) {
          updateConfetti(delta);
          drawConfetti();
        }
        if (sparks.length) {
          updateSparks(delta);
          drawSparks();
        }
      }

      animate(performance.now());
    });
  </script>
</body>
</html>
